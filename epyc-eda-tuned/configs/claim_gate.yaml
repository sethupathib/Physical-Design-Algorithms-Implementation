# CLAIM_GATE thresholds for epyc-eda-tuned
# All performance public claims must pass scripts/claim_gate.sh

claim_id: epyc_eda_lower_migration_cost_reduces_spread_makespan
bench: fanout_bench
mode: spread
high_migration_cost_ns: 5000000
low_migration_cost_ns: 10000
outer_iters: 7
