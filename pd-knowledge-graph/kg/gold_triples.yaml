  - [StdCell, is_a, PhysicalObject, {s_type: PhysicalObject, o_type: PhysicalObject, triple_class: backbone, csa: [PhysicalObject, StdCell], confidence: 1.0, provenance: "ontology"}]
  - [Macro, is_a, PhysicalObject, {s_type: PhysicalObject, o_type: PhysicalObject, triple_class: backbone, csa: [PhysicalObject, Macro], confidence: 1.0, provenance: "ontology"}]
  - [Via, part_of, Interconnect_Stack, {s_type: PhysicalObject, o_type: PhysicalObject, triple_class: backbone, csa: [PhysicalObject, Via], confidence: 0.95, provenance: "BEOL"}]
  - [Power_Strap, part_of, Power_Grid, {s_type: PhysicalObject, o_type: PhysicalObject, triple_class: backbone, csa: [PhysicalObject, Power_Strap], confidence: 0.95, provenance: "PG structure"}]

  # ---- Vendor-neutral tool classes ----
  - [Implementation_Tool, detects, Routing_Congestion, {s_type: ToolClass, o_type: FailureMode, triple_class: backbone, csa: [ToolClass, Implementation_Tool], confidence: 0.9, provenance: "cong maps in PnR"}]
  - [STA_Tool, detects, Setup_Violation, {s_type: ToolClass, o_type: FailureMode, triple_class: backbone, csa: [ToolClass, STA_Tool], confidence: 1.0, provenance: "timing reports"}]
  - [STA_Tool, detects, Hold_Violation, {s_type: ToolClass, o_type: FailureMode, triple_class: backbone, csa: [ToolClass, STA_Tool], confidence: 1.0, provenance: "timing reports"}]
  - [Extraction_Tool, produces, SPEF_or_RCDB, {s_type: ToolClass, o_type: OutputArtifact, triple_class: backbone, csa: [ToolClass, Extraction_Tool], confidence: 0.98, provenance: "RC extraction"}]
  - [Physical_Verification_Tool, detects, DRC_Violation, {s_type: ToolClass, o_type: FailureMode, triple_class: backbone, csa: [ToolClass, Physical_Verification_Tool], confidence: 1.0, provenance: "DRC engine"}]
